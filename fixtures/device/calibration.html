<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalibrering</title>
<style>
html, body { margin:0; padding:0; background:#fff; color:#222; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
body { height:3000px; position:relative; }
.m { position:fixed; width:24px; height:24px; background:#ff00ff; z-index:10; }
#doc { position:absolute; left:16px; top:1200px; width:24px; height:24px; background:#ff00ff; }
#flash { position:fixed; left:0; top:52px; width:100%; height:40px; background:#00ff00; z-index:20; display:none; pointer-events:none; }
.lead { position:absolute; left:56px; top:104px; right:56px; font-size:17px; line-height:1.5; color:#333; }
.lead h1 { font-size:24px; margin:0 0 8px; }
.ruler { position:absolute; left:48px; width:1px; height:3000px; background:repeating-linear-gradient(#bbb 0 1px, transparent 1px 100px); }
.tick { position:absolute; left:56px; font-size:13px; color:#777; }
</style>
</head>
<body>
<div class="lead"><h1>Kalibrering</h1>Fire markører ligger fast i hjørnene av visningen. En femte ligger i selve dokumentet på y = 1200. Trykk hvor som helst for å vise en stripe øverst.</div>
<div class="m" data-cal="tl"></div>
<div class="m" data-cal="tr"></div>
<div class="m" data-cal="bl"></div>
<div class="m" data-cal="br"></div>
<div id="doc" data-cal="doc"></div>
<div id="flash"></div>
<script>
(() => {
  for (let y = 400; y < 3000; y += 200) {
    const t = document.createElement('div'); t.className = 'tick'; t.style.top = y + 'px'; t.textContent = y; document.body.appendChild(t);
  }
  // inset from the edges (12 % / 88 % across, 20 % / 80 % down): a real phone's rounded corners, cutout, edge-to-edge
  // navigation bar or a Chrome bottom toolbar can cover the outermost pixels; the fit only needs a wide rectangle
  const X0 = () => Math.round(window.innerWidth * 0.12), X1 = () => Math.round(window.innerWidth * 0.88) - 24;
  const Y0 = () => Math.round(window.innerHeight * 0.2), Y1 = () => Math.round(window.innerHeight * 0.8) - 24;
  const pos = { tl: () => [X0(), Y0()], tr: () => [X1(), Y0()], bl: () => [X0(), Y1()], br: () => [X1(), Y1()] };
  function place() {
    for (const k in pos) {
      const el = document.querySelector(`[data-cal="${k}"]`); const [x, y] = pos[k]();
      el.style.left = x + 'px'; el.style.top = y + 'px';
    }
  }
  place();
  window.addEventListener('resize', place);
  if (window.visualViewport) { visualViewport.addEventListener('resize', place); visualViewport.addEventListener('scroll', place); }
  const flash = document.getElementById('flash'); let timer = 0;
  function hit() {
    window.__lastTouch = performance.now();
    flash.style.display = 'block'; clearTimeout(timer);
    timer = setTimeout(() => { flash.style.display = 'none'; }, 150);
  }
  window.addEventListener('touchstart', hit, { passive: true });
  window.addEventListener('pointerdown', hit, { passive: true });
  window.__lastTouch = 0;
})();
</script>
</body>
</html>
